<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>QA Owner Acceptance</title>
  <link rel="stylesheet" href="/shared-design-tokens.css">
  <style>
    body{margin:0;background:#f4f7f5;color:#142033;font-family:Inter,"Microsoft YaHei",system-ui,sans-serif}.shell{min-height:100vh;display:grid;place-items:center;padding:22px}.card{width:min(460px,100%);box-sizing:border-box;background:#fff;border:1px solid #dfe7e2;border-radius:24px;padding:26px;box-shadow:0 18px 48px rgba(20,32,51,.12)}.badge{display:inline-block;padding:5px 10px;border-radius:999px;background:#eaf7ef;color:#08773a;font-weight:900}.muted{color:#637083}.field{display:grid;gap:7px;margin:20px 0}.field input{font:inherit;padding:13px 14px;border:1px solid #bdcbc3;border-radius:13px}.btn{width:100%;border:0;border-radius:13px;padding:13px 16px;background:#078d42;color:#fff;font:inherit;font-weight:900}.btn:disabled{opacity:.55}.status{min-height:24px;margin-top:14px}.bad{color:#b42318}.ok{color:#08773a}code{word-break:break-all}
  </style>
</head>
<body><main class="shell"><section class="card" aria-label="QA Owner Acceptance login">
  <span class="badge">QA ENVIRONMENT / QA 环境</span>
  <h1>QA Owner Acceptance</h1>
  <p>Use the single-use QA Owner handoff code for this Run.</p>
  <p class="muted">Current Run / 当前验收：<code id="runId">-</code></p>
  <p class="muted">Production passwords are not accepted here. 此入口不接受生产密码。</p>
  <p class="muted">The QA Owner session is isolated from the Employee session in this browser.</p>
  <form id="handoffForm">
    <label class="field">One-time code / 一次性登录码
      <input id="handoffCode" type="password" autocomplete="one-time-code" spellcheck="false" required>
    </label>
    <button class="btn" id="submitButton" type="submit">Continue to Acceptance Console / 进入验收台</button>
  </form>
  <div id="status" class="status" role="status"></div>
</section></main><script>
const params=new URLSearchParams(location.search);
const runId=String(params.get('qa_run_id')||'').trim().toUpperCase();
const validRun=/^QA-\d{8}-[A-Z0-9]{4,12}$/.test(runId);
document.getElementById('runId').textContent=validRun?runId:'Invalid Run ID';
const form=document.getElementById('handoffForm'),code=document.getElementById('handoffCode'),button=document.getElementById('submitButton'),status=document.getElementById('status');
if(!validRun){button.disabled=true;status.textContent='Invalid QA Run ID.';status.className='status bad'}
form.addEventListener('submit',async event=>{
  event.preventDefault();if(!validRun)return;
  const value=code.value.trim();if(!value){status.textContent='Enter the one-time code.';status.className='status bad';return}
  button.disabled=true;status.textContent='Verifying QA handoff…';status.className='status';
  try{
    const response=await fetch('/api/qa/acceptance/owner-handoff/session',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({qa_run_id:runId,code:value})});
    const raw=await response.json().catch(()=>({}));const data=raw?.data&&typeof raw.data==='object'?raw.data:raw;
    code.value='';
    if(!response.ok||data?.success===false)throw new Error(data?.error_code||`HTTP_${response.status}`);
    status.textContent='QA Owner session created. Opening Acceptance Console…';status.className='status ok';
    location.replace(data.next_path||`/qa/acceptance?qa_run_id=${encodeURIComponent(runId)}`);
  }catch(error){status.textContent=`Handoff failed: ${String(error?.message||error)}`;status.className='status bad';button.disabled=false}
});
</script></body></html>
