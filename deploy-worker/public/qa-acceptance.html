<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Homelink QA Acceptance</title>
  <link rel="stylesheet" href="/shared-design-tokens.css">
  <style>
    body{margin:0;background:#f4f7f5;color:#142033;font-family:Inter,"Microsoft YaHei",system-ui,sans-serif}.wrap{max-width:1040px;margin:auto;padding:28px}.hero,.card{background:#fff;border:1px solid #dfe7e2;border-radius:22px;padding:22px;margin-bottom:18px;box-shadow:0 14px 35px rgba(20,32,51,.08)}h1{margin:0 0 8px}.muted{color:#637083}.row{display:flex;gap:10px;flex-wrap:wrap}.btn,select{border:1px solid #cfd9d3;border-radius:13px;padding:11px 14px;background:#fff;font:inherit;font-weight:800}.btn.primary{background:#078d42;color:#fff;border-color:#078d42}.btn:disabled{opacity:.45}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}.kv{background:#f7faf8;border-radius:14px;padding:12px}.kv span{display:block;font-size:12px;color:#637083}.kv b{display:block;margin-top:4px;word-break:break-word}.status{display:inline-block;border-radius:999px;padding:5px 10px;background:#eaf7ef;color:#08773a;font-weight:900}.links a{display:inline-block;margin:5px 8px 5px 0}.bad{color:#c62828}.hidden{display:none}pre{white-space:pre-wrap;word-break:break-word;max-height:440px;overflow:auto;background:#f7faf8;border-radius:14px;padding:12px}</style>
</head>
<body><main class="wrap">
  <section class="hero"><h1>Homelink End-to-End QA</h1><p class="muted">QA-only acceptance console. Manual acceptance buttons are reviewer actions and are never automated.</p><div id="environment" class="status">Loading QA boundary…</div></section>
  <section class="card"><h2>Create QA Run</h2><div class="row"><select id="mode"><option value="quick">Quick · 16</option><option value="full">Full</option><option value="recovery">Recovery</option></select><button class="btn primary" id="create">Create Run</button><button class="btn" id="refresh">Refresh</button></div><p id="message" class="muted"></p></section>
  <section id="run" class="card hidden"><div class="row" style="justify-content:space-between"><h2 id="runId"></h2><span id="status" class="status"></span></div><div id="facts" class="grid"></div><div id="links" class="links"></div><hr><h3>Validation provenance</h3><div class="row"><select id="diagnosticEntry"><option value="">All Entries</option></select><button class="btn" id="refreshDiagnostic">Refresh Diagnostic</button><button class="btn" id="copyDiagnostic">Copy Diagnostic Bundle</button></div><div id="diagnosticFacts" class="grid"></div><details><summary>Bounded diagnostic JSON</summary><pre id="diagnosticResult"></pre></details><hr><div class="row"><button class="btn primary" id="acceptEmployee">Accept Employee Review</button><button class="btn primary" id="acceptOwner">Accept Owner Review</button><button class="btn" id="reconcile">Run Reconciliation</button><button class="btn" id="cleanup">Cleanup Run</button></div><pre id="result"></pre></section>
  <section class="card"><h2>Recent Runs</h2><div id="runs"></div></section>
</main><script>
const $=id=>document.getElementById(id);let current=null;let currentDiagnostic=null;
async function api(path,options={}){const r=await fetch(path,{credentials:'include',headers:{'Content-Type':'application/json',...(options.headers||{})},...options});const raw=await r.text();let body={};try{body=raw?JSON.parse(raw):{}}catch{body={error_code:'NON_JSON_RESPONSE'}}const data=body?.data&&typeof body.data==='object'?body.data:body;if(!r.ok||data?.success===false)throw new Error(data?.error_code||data?.error||`HTTP_${r.status}`);return data}
function renderRun(run){current=run;$('run').classList.remove('hidden');$('runId').textContent=run.qa_run_id;$('status').textContent=run.status;$('facts').innerHTML=[['Mode',run.mode],['Scenarios',run.scenario_count],['Employee records',run.employee_record_count],['Artifact',run.artifact_sha256],['Worker',run.qa_worker_version],['Commit',run.artifact_commit],['Matrix',run.matrix_version]].map(([k,v])=>`<div class="kv"><span>${k}</span><b>${String(v||'-')}</b></div>`).join('');const links=run.links||{};$('links').innerHTML=Object.entries(links).map(([k,v])=>`<a class="btn" href="${v}" target="_blank" rel="noopener">${k.replaceAll('_',' ')}</a>`).join('');$('acceptEmployee').disabled=run.status!=='AUTOMATION_PASS';$('acceptOwner').disabled=run.status!=='UPLOAD_PASS';$('reconcile').disabled=run.status!=='MANUAL_OWNER_ACCEPTED';loadDiagnostic()}
async function loadDiagnostic(){if(!current)return;const entry=$('diagnosticEntry').value;const data=await api(`/api/qa/acceptance/runs/${current.qa_run_id}/diagnostics${entry?`?entry_id=${encodeURIComponent(entry)}`:''}`);currentDiagnostic=data;const rows=data.entries||[];if(!entry){$('diagnosticEntry').innerHTML='<option value="">All Entries</option>'+rows.map(row=>`<option value="${row.entry_id}">${row.entry_id} · ${row.event_type}</option>`).join('')}$('diagnosticFacts').innerHTML=[['Validation attempt',data.latest_validation_attempt?.validation_attempt_id],['Payload hash',data.latest_validation_attempt?.payload_hash],['Result origin',data.latest_validation_attempt?.result_origin],['Server time',data.latest_validation_attempt?.server_validated_at],['Registered errors',data.error_catalog?.registered_error_code_count],['State',rows.every(row=>row.stale_current==='CURRENT')?'CURRENT':'STALE / NEEDS REVALIDATION']].map(([k,v])=>`<div class="kv"><span>${k}</span><b>${String(v||'-')}</b></div>`).join('');$('diagnosticResult').textContent=JSON.stringify(data,null,2)}
$('refreshDiagnostic').onclick=()=>loadDiagnostic().catch(e=>$('diagnosticResult').textContent=e.message);$('diagnosticEntry').onchange=()=>loadDiagnostic().catch(e=>$('diagnosticResult').textContent=e.message);$('copyDiagnostic').onclick=async()=>{if(!currentDiagnostic)await loadDiagnostic();await navigator.clipboard.writeText(JSON.stringify(currentDiagnostic,null,2));$('message').textContent='Diagnostic bundle copied. No credentials or Production data included.'};
async function load(){try{const data=await api('/api/qa/acceptance/runs');$('environment').textContent='QA isolation verified';$('runs').innerHTML=(data.runs||[]).map(r=>`<button class="btn" data-run="${r.qa_run_id}">${r.qa_run_id} · ${r.status}</button>`).join('')||'<span class="muted">No runs</span>';document.querySelectorAll('[data-run]').forEach(b=>b.onclick=async()=>renderRun(await api('/api/qa/acceptance/runs/'+b.dataset.run)))}catch(e){$('environment').textContent='QA boundary failed';$('environment').classList.add('bad');$('message').textContent=e.message}}
$('create').onclick=async()=>{try{renderRun(await api('/api/qa/acceptance/runs',{method:'POST',body:JSON.stringify({mode:$('mode').value})}));await load()}catch(e){$('message').textContent=e.message}};$('refresh').onclick=load;
$('acceptEmployee').onclick=async()=>{if(!confirm('Confirm that YOU manually reviewed the Employee QA ticket and Preview?'))return;renderRun(await api(`/api/qa/acceptance/runs/${current.qa_run_id}/accept-employee`,{method:'POST',body:'{}'}))};
$('acceptOwner').onclick=async()=>{if(!confirm('Confirm that YOU manually reviewed Owner History, Detail, Finance, Arrears and Todo?'))return;renderRun(await api(`/api/qa/acceptance/runs/${current.qa_run_id}/accept-owner`,{method:'POST',body:'{}'}))};
$('reconcile').onclick=async()=>renderRun(await api(`/api/qa/acceptance/runs/${current.qa_run_id}/reconcile`,{method:'POST',body:'{}'}));
$('cleanup').onclick=async()=>{if(!confirm(`Cleanup QA business projections for ${current.qa_run_id}?`))return;renderRun(await api(`/api/qa/acceptance/runs/${current.qa_run_id}/cleanup`,{method:'POST',body:JSON.stringify({qa_run_id:current.qa_run_id})}))};load();
</script></body></html>
